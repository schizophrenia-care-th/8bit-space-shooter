    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 8-Bit Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', cursive;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #050510;
            color: #fff;
            overflow: hidden;
        }
        .arcade-frame {
            border: 4px solid #3b82f6;
            box-shadow: 0 0 15px #3b82f6, inset 0 0 15px #3b82f6;
        }
        .neon-text-pink {
            text-shadow: 0 0 5px #ec4899, 0 0 10px #ec4899;
        }
        .neon-text-blue {
            text-shadow: 0 0 5px #3b82f6, 0 0 10px #3b82f6;
        }
        .neon-btn {
            box-shadow: 0 0 10px #3b82f6;
            transition: all 0.1s ease;
        }
        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px #ec4899;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 bg-slate-950">

    <div class="relative w-full max-w-2xl bg-black rounded-lg p-2 sm:p-4 arcade-frame flex flex-col items-center">
        <!-- Arcade Header -->
        <div class="w-full flex justify-between items-center mb-2 px-2 text-xs sm:text-sm">
            <div class="text-pink-500 neon-text-pink">SCORE: <span id="scoreDisplay" class="text-white">000000</span></div>
            <div class="text-yellow-400">HI: <span id="hiScoreDisplay" class="text-white">000000</span></div>
            <div class="text-blue-400 neon-text-blue">LIVES: <span id="livesDisplay" class="text-red-500">♥♥♥</span></div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full aspect-[3/4] max-h-[70vh] bg-black overflow-hidden rounded border-2 border-slate-800">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Overlay Screen: Start / Pause / Game Over -->
            <div id="overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4 text-center z-10">
                <h1 id="overlayTitle" class="text-2xl sm:text-4xl text-pink-500 neon-text-pink mb-4 leading-relaxed">SPACE<br/>SHOOTER</h1>
                <p id="overlaySubtitle" class="text-xs sm:text-sm text-cyan-300 mb-8 leading-loose">PRESS START TO PLAY</p>
                <button id="startBtn" class="neon-btn bg-pink-600 hover:bg-pink-500 text-white px-6 py-3 rounded-md text-sm sm:text-base border-2 border-pink-300">
                    START GAME
                </button>
            </div>
        </div>

        <!-- Touch Controls for Mobile -->
        <div id="touchControls" class="w-full mt-3 grid grid-cols-3 gap-2 sm:hidden select-none">
            <div class="grid grid-cols-3 gap-1">
                <div></div>
                <button id="btnUp" class="bg-slate-800 border border-slate-600 active:bg-blue-600 p-3 rounded text-center text-xs">▲</button>
                <div></div>
                <button id="btnLeft" class="bg-slate-800 border border-slate-600 active:bg-blue-600 p-3 rounded text-center text-xs">◄</button>
                <button id="btnDown" class="bg-slate-800 border border-slate-600 active:bg-blue-600 p-3 rounded text-center text-xs">▼</button>
                <button id="btnRight" class="bg-slate-800 border border-slate-600 active:bg-blue-600 p-3 rounded text-center text-xs">►</button>
            </div>
            <div class="flex items-center justify-center">
                <button id="btnPause" class="bg-slate-800 border border-slate-600 active:bg-yellow-600 px-3 py-2 rounded text-[10px]">PAUSE</button>
            </div>
            <div class="flex items-center justify-center">
                <button id="btnFire" class="w-full h-full bg-red-600 border border-red-400 active:bg-red-400 rounded flex items-center justify-center text-xs font-bold shadow-lg">
                    FIRE
                </button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRetroSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(900, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch(e) { console.error(e); }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const hiScoreDisplay = document.getElementById('hiScoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');

        // Internal Game Resolution (Pixel Art standard)
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 420;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // Game State
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let score = 0;
        let hiScore = localStorage.getItem('8bit_hi_score') || 0;
        let lives = 3;
        let frameCount = 0;

        hiScoreDisplay.textContent = String(hiScore).padStart(6, '0');

        // Controls State
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            KeyW: false, KeyS: false, KeyA: false, KeyD: false,
            Space: false
        };

        // Stars
        const stars = Array.from({ length: 50 }, () => ({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            size: Math.random() > 0.8 ? 2 : 1,
            speed: Math.random() * 1.5 + 0.5,
            color: ['#fff', '#64748b', '#38bdf8', '#f472b6'][Math.floor(Math.random() * 4)]
        }));

        // Player
        const player = {
            x: GAME_WIDTH / 2 - 10,
            y: GAME_HEIGHT - 40,
            width: 20,
            height: 20,
            speed: 3,
            cooldown: 0,
            weaponLevel: 1, // 1: Normal, 2: Triple, 3: Rapid Triple
            shield: false,
            shieldTimer: 0,
            invulnerable: 0,

            reset() {
                this.x = GAME_WIDTH / 2 - 10;
                this.y = GAME_HEIGHT - 40;
                this.weaponLevel = 1;
                this.shield = false;
                this.invulnerable = 60;
            },

            draw() {
                if (this.invulnerable % 4 >= 2) return; // Blink effect

                ctx.fillStyle = '#38bdf8'; // Blue body
                ctx.fillRect(this.x + 8, this.y, 4, 20);
                ctx.fillRect(this.x + 4, this.y + 6, 12, 10);
                ctx.fillRect(this.x, this.y + 12, 20, 6);

                // Cockpit
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(this.x + 8, this.y + 4, 4, 4);

                // Thruster
                if (frameCount % 6 < 3) {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(this.x + 8, this.y + 20, 4, 4);
                }

                // Shield Aura
                if (this.shield) {
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + 10, this.y + 10, 16, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];

        function spawnEnemy() {
            const types = [
                { type: 'scout', hp: 1, score: 100, width: 16, height: 16, color: '#f43f5e' },
                { type: 'fighter', hp: 2, score: 200, width: 20, height: 20, color: '#eab308' },
                { type: 'boss', hp: 5, score: 500, width: 28, height: 24, color: '#a855f7' }
            ];

            let rand = Math.random();
            let chosen = types[0];
            if (rand > 0.85) chosen = types[2];
            else if (rand > 0.5) chosen = types[1];

            enemies.push({
                ...chosen,
                x: Math.random() * (GAME_WIDTH - chosen.width),
                y: -chosen.height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 0.8 + 0.8,
                shootTimer: Math.floor(Math.random() * 100)
            });
        }

        function spawnPowerup(x, y) {
            const pTypes = ['TRIPLE', 'SHIELD', 'SPEED'];
            const type = pTypes[Math.floor(Math.random() * pTypes.length)];
            powerups.push({ x, y, type, width: 12, height: 12, vy: 1 });
        }

        function createExplosion(x, y, color = '#f97316', count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    size: Math.random() * 3 + 1,
                    color: color,
                    life: 20
                });
            }
            playRetroSound('explosion');
        }

        function firePlayerBullet() {
            playRetroSound('laser');
            if (player.weaponLevel === 1) {
                bullets.push({ x: player.x + 9, y: player.y, vx: 0, vy: -6 });
            } else {
                bullets.push({ x: player.x + 2, y: player.y + 4, vx: -1.2, vy: -5.5 });
                bullets.push({ x: player.x + 9, y: player.y, vx: 0, vy: -6 });
                bullets.push({ x: player.x + 16, y: player.y + 4, vx: 1.2, vy: -5.5 });
            }
        }

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if (e.code === 'KeyP') togglePause();
        });

        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // Mobile Buttons Binding
        function bindTouchBtn(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouchBtn('btnUp', 'ArrowUp');
        bindTouchBtn('btnDown', 'ArrowDown');
        bindTouchBtn('btnLeft', 'ArrowLeft');
        bindTouchBtn('btnRight', 'ArrowRight');
        bindTouchBtn('btnFire', 'Space');
        document.getElementById('btnPause').addEventListener('click', togglePause);

        startBtn.addEventListener('click', () => {
            initAudio();
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                overlay.classList.add('hidden');
            }
        });

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                overlayTitle.innerHTML = 'PAUSED';
                overlaySubtitle.textContent = 'PRESS START TO RESUME';
                startBtn.textContent = 'RESUME';
                overlay.classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                overlay.classList.add('hidden');
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            player.reset();
            updateUI();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
        }

        function updateUI() {
            scoreDisplay.textContent = String(score).padStart(6, '0');
            livesDisplay.textContent = '♥'.repeat(Math.max(0, lives));
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('8bit_hi_score', hiScore);
                hiScoreDisplay.textContent = String(hiScore).padStart(6, '0');
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            overlayTitle.innerHTML = 'GAME OVER';
            overlaySubtitle.textContent = `FINAL SCORE: ${score}`;
            startBtn.textContent = 'RESTART';
            overlay.classList.remove('hidden');
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;

            // Player Movement
            if ((keys.ArrowLeft || keys.KeyA) && player.x > 0) player.x -= player.speed;
            if ((keys.ArrowRight || keys.KeyD) && player.x < GAME_WIDTH - player.width) player.x += player.speed;
            if ((keys.ArrowUp || keys.KeyW) && player.y > 0) player.y -= player.speed;
            if ((keys.ArrowDown || keys.KeyS) && player.y < GAME_HEIGHT - player.height) player.y += player.speed;

            // Firing
            if (player.cooldown > 0) player.cooldown--;
            if (keys.Space && player.cooldown === 0) {
                firePlayerBullet();
                player.cooldown = player.weaponLevel === 3 ? 8 : 14;
            }

            if (player.invulnerable > 0) player.invulnerable--;

            // Stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > GAME_HEIGHT) star.y = 0;
            });

            // Player Bullets
            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -10 || b.x < 0 || b.x > GAME_WIDTH) bullets.splice(index, 1);
            });

            // Enemy Bullets
            enemyBullets.forEach((eb, index) => {
                eb.x += eb.vx;
                eb.y += eb.vy;
                if (eb.y > GAME_HEIGHT + 10) enemyBullets.splice(index, 1);

                // Collision with player
                if (player.invulnerable === 0 &&
                    eb.x > player.x && eb.x < player.x + player.width &&
                    eb.y > player.y && eb.y < player.y + player.height) {
                    
                    enemyBullets.splice(index, 1);
                    hitPlayer();
                }
            });

            // Spawning Enemies
            if (frameCount % 45 === 0) {
                spawnEnemy();
            }

            // Enemies Logic
            enemies.forEach((enemy, eIdx) => {
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;

                // Bounce off edges
                if (enemy.x <= 0 || enemy.x >= GAME_WIDTH - enemy.width) enemy.vx *= -1;

                // Enemy Shooting
                enemy.shootTimer--;
                if (enemy.shootTimer <= 0) {
                    enemy.shootTimer = 120 + Math.random() * 80;
                    enemyBullets.push({ x: enemy.x + enemy.width / 2, y: enemy.y + enemy.height, vx: 0, vy: 2.5 });
                }

                // Collision with Player Bullets
                bullets.forEach((b, bIdx) => {
                    if (b.x > enemy.x && b.x < enemy.x + enemy.width &&
                        b.y > enemy.y && b.y < enemy.y + enemy.height) {
                        
                        bullets.splice(bIdx, 1);
                        enemy.hp--;
                        playRetroSound('hit');

                        if (enemy.hp <= 0) {
                            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                            score += enemy.score;
                            updateUI();

                            // Powerup Drop Chance
                            if (Math.random() < 0.2) {
                                spawnPowerup(enemy.x, enemy.y);
                            }

                            enemies.splice(eIdx, 1);
                        }
                    }
                });

                // Collision with Player
                if (player.invulnerable === 0 &&
                    player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
                    
                    createExplosion(enemy.x, enemy.y);
                    enemies.splice(eIdx, 1);
                    hitPlayer();
                }

                if (enemy.y > GAME_HEIGHT + 20) enemies.splice(eIdx, 1);
            });

            // Powerups Logic
            powerups.forEach((p, pIdx) => {
                p.y += p.vy;

                if (player.x < p.x + p.width && player.x + player.width > p.x &&
                    player.y < p.y + p.height && player.y + player.height > p.y) {
                    
                    playRetroSound('powerup');
                    if (p.type === 'TRIPLE') player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                    else if (p.type === 'SHIELD') player.shield = true;
                    else if (p.type === 'SPEED') player.speed = 4.5;

                    powerups.splice(pIdx, 1);
                }

                if (p.y > GAME_HEIGHT) powerups.splice(pIdx, 1);
            });

            // Particles
            particles.forEach((p, pIdx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(pIdx, 1);
            });
        }

        function hitPlayer() {
            if (player.shield) {
                player.shield = false;
                player.invulnerable = 40;
                playRetroSound('hit');
                return;
            }

            lives--;
            updateUI();
            createExplosion(player.x + 10, player.y + 10, '#38bdf8', 20);

            if (lives <= 0) {
                gameOver();
            } else {
                player.reset();
            }
        }

        function render() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw Stars
            stars.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Draw Player
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                player.draw();
            }

            // Draw Bullets
            ctx.fillStyle = '#fef08a';
            bullets.forEach(b => ctx.fillRect(b.x - 1, b.y, 2, 5));

            ctx.fillStyle = '#ef4444';
            enemyBullets.forEach(eb => ctx.fillRect(eb.x - 1, eb.y, 3, 5));

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                // Simple 8-bit Pixel Enemy Rendering
                ctx.fillRect(e.x + 2, e.y, e.width - 4, e.height);
                ctx.fillRect(e.x, e.y + 4, e.width, e.height - 8);
                // Eyes/Details
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x + 4, e.y + 6, 3, 3);
                ctx.fillRect(e.x + e.width - 7, e.y + 6, 3, 3);
            });

            // Draw Powerups
            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'TRIPLE' ? '#22c55e' : p.type === 'SHIELD' ? '#a855f7' : '#eab308';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#fff';
                ctx.font = '8px "Press Start 2P"';
                ctx.fillText(p.type[0], p.x + 2, p.y + 9);
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
